<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان الفسيولوجي — المحاضرة الأولى (Somatic Nervous System)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --warning: #d97706;
    --warning-bg: #fffbeb;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --bg-page: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    direction: rtl;
    line-height: 1.6;
  }

  .container {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 16px 60px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ── Initial Screen: ONLY Name Input and Start Button ── */
  .start-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
  }

  .start-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 32px 26px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-input {
    width: 100%;
    padding: 14px 18px;
    font-size: 16px;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    color: var(--text-main);
    transition: 0.2s;
    outline: none;
    text-align: center;
  }

  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .btn-start {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 14px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }
  .btn-start:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
  }

  /* ── Exam In-Progress Screen ── */
  .exam-bar {
    position: sticky;
    top: 14px;
    z-index: 99;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .student-badge {
    font-weight: 800;
    font-size: 14.5px;
    color: var(--primary);
  }

  .exam-stats {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .progress-wrap {
    width: 100%;
    height: 6px;
    background: #f1f5f9;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2563eb, #10b981);
    transition: width 0.3s ease;
  }

  /* Question Cards */
  .question-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 16px;
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: all 0.2s;
  }

  .question-card:hover {
    border-color: #cbd5e1;
  }

  .question-top {
    margin-bottom: 12px;
  }

  .q-number {
    background: #eff6ff;
    color: var(--primary);
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .q-title {
    font-family: 'Inter', system-ui, sans-serif;
    direction: ltr;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    color: #1e293b;
    line-height: 1.5;
    margin-top: 8px;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    direction: ltr;
    text-align: left;
    font-family: 'Inter', system-ui, sans-serif;
    margin-top: 14px;
  }

  .option-label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 15px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: #ffffff;
    font-size: 14.5px;
    font-weight: 500;
    color: #334155;
    user-select: none;
  }

  .option-label:hover {
    border-color: var(--primary);
    background: #f8fafc;
  }

  .option-label input[type="radio"] {
    accent-color: var(--primary);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .option-label.selected {
    border-color: var(--primary);
    background: #eff6ff;
    color: #1e40af;
    font-weight: 600;
  }

  /* Submit Button */
  .submit-bar {
    margin-top: 26px;
    text-align: center;
  }

  .btn-submit {
    background: #16a34a;
    color: white;
    border: none;
    padding: 15px 36px;
    font-size: 16.5px;
    font-weight: 800;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    min-width: 240px;
  }
  .btn-submit:hover {
    background: #15803d;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
  }

  /* ── Result & Correction Screen ── */
  .result-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 32px 24px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    text-align: center;
    margin-bottom: 26px;
    animation: fadeIn 0.3s ease;
  }

  .score-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #eff6ff;
    border: 4px solid var(--primary);
  }

  .score-circle.perfect {
    background: #f0fdf4;
    border-color: var(--success);
  }

  .score-num {
    font-size: 30px;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
  }
  .score-circle.perfect .score-num {
    color: var(--success);
  }

  .score-total {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 700;
  }

  .result-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .result-subtitle {
    font-size: 14.5px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .result-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 11px 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: 0.2s;
  }

  .btn-retake {
    background: #f1f5f9;
    color: var(--text-main);
  }
  .btn-retake:hover { background: #e2e8f0; }

  .btn-view-results {
    background: var(--primary);
    color: white;
  }
  .btn-view-results:hover { background: var(--primary-dark); }

  /* Detailed Correction Section */
  .corrections-section {
    margin-top: 28px;
    text-align: right;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .section-header h3 {
    font-size: 18px;
    font-weight: 800;
  }

  .toggle-filter-btn {
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    color: var(--text-muted);
  }
  .toggle-filter-btn:hover { color: var(--primary); border-color: var(--primary); }

  .correction-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  .correction-card.is-wrong {
    border-color: #fecaca;
    background: #fffafa;
  }

  .correction-card.is-correct {
    border-color: #bbf7d0;
    background: #fafdfb;
  }

  .correction-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .q-badge-status {
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
  }
  .status-wrong {
    background: var(--danger-bg);
    color: var(--danger);
  }
  .status-correct {
    background: var(--success-bg);
    color: var(--success);
  }

  .q-text-en {
    font-family: 'Inter', system-ui, sans-serif;
    direction: ltr;
    text-align: left;
    font-weight: 600;
    font-size: 15px;
    color: #1e293b;
    margin-bottom: 12px;
  }

  .answers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 9px;
    margin-bottom: 14px;
    font-family: 'Inter', system-ui, sans-serif;
    direction: ltr;
    text-align: left;
  }

  .ans-box {
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .ans-user-wrong {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #f87171;
  }
  .ans-correct-key {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
  }

  /* Medical Explanation Box */
  .medical-explanation {
    background: #f8fafc;
    border-right: 3px solid var(--primary);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 13.5px;
    line-height: 1.8;
  }

  .explanation-title {
    font-weight: 800;
    color: var(--primary);
    font-size: 13px;
    margin-bottom: 3px;
  }

  .medical-terms {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #cbd5e1;
    font-size: 12px;
    color: #475569;
    font-weight: 600;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .exam-bar { flex-direction: column; align-items: flex-start; }
    .result-actions { flex-direction: column; width: 100%; }
    .action-btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- SCREEN 1: ONLY Name Input and Start Exam Button -->
  <div id="startScreen" class="start-wrapper">
    <div class="start-card">
      <form id="startForm" onsubmit="startExam(event)">
        <div class="form-group">
          <input 
            type="text" 
            id="studentName" 
            class="form-input" 
            placeholder="الاسم" 
            required 
            autocomplete="name"
            autofocus
          />
        </div>

        <button type="submit" id="startBtn" class="btn-start">
          بدء الامتحان
        </button>
      </form>
    </div>
  </div>

  <!-- SCREEN 2: Exam In-Progress (Hidden by default) -->
  <div id="examScreen" style="display:none;">
    
    <div class="exam-bar">
      <div class="student-badge">
        <span>الطالب: </span>
        <span id="activeStudentName"></span>
      </div>
      <div class="exam-stats">
        <div>تمت الإجابة: <span id="answeredCount" style="color:var(--primary);font-weight:800">0</span> / 20</div>
        <div>الوقت: <span id="examTimer">00:00</span></div>
      </div>
      <div class="progress-wrap">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Questions Container -->
    <div id="questionsContainer"></div>

    <div class="submit-bar">
      <button type="button" class="btn-submit" onclick="submitExam()">
        تسليم الامتحان وإنهاء الاختبار
      </button>
    </div>
  </div>

  <!-- SCREEN 3: Results & Detailed Correction (Hidden by default) -->
  <div id="resultScreen" style="display:none;">
    
    <div class="result-card">
      <div class="score-circle" id="scoreCircle">
        <div class="score-num" id="scoreDisplay">0</div>
        <div class="score-total">من 20</div>
      </div>

      <div class="result-title" id="resultGreeting">نتيجتك في الامتحان</div>
      <div class="result-subtitle" id="resultSubtext"></div>

      <div class="result-actions">
        <button type="button" class="action-btn btn-retake" onclick="resetExam()">
          إعادة الامتحان
        </button>
      </div>
    </div>

    <!-- Detailed Corrections Section -->
    <div class="corrections-section">
      <div class="section-header">
        <h3>تصحيح الأسئلة والشرح الطبي بالعربية</h3>
        <div>
          <button class="toggle-filter-btn" id="filterToggleBtn" onclick="toggleCorrectionFilter()">
            عرض الأسئلة الخاطئة فقط
          </button>
        </div>
      </div>

      <div id="correctionsList"></div>
    </div>

  </div>

</div>

<script>
// The 20 Questions
const questions = [
  ["The Somatic Nervous System is mainly responsible for:", ["Involuntary functions","Voluntary movements","Gland secretion","Heart contraction"], "B"],
  ["Somatic Nervous System mainly controls:", ["Cardiac muscle","Smooth muscle","Skeletal muscle","Glands"], "C"],
  ["Moving your hand voluntarily is an example of:", ["Involuntary action","Autonomic action","Voluntary action","Reflex only"], "C"],
  ["The Somatic Motor Pathway contains:", ["One motor neuron","Two motor neurons","Three motor neurons","No neurons"], "A"],
  ["The pathway of the Somatic Motor System is:", ["CNS → Ganglion → Muscle","CNS → One Motor Neuron → Skeletal Muscle","CNS → Two Neurons → Organ","Muscle → CNS → Ganglion"], "B"],
  ["The Autonomic Motor Pathway contains:", ["One neuron","Two neurons","Three neurons","No neurons"], "B"],
  ["The first neuron in the autonomic pathway is called:", ["Postganglionic neuron","Motor neuron","Preganglionic neuron","Sensory neuron"], "C"],
  ["The second neuron in the autonomic pathway is called:", ["Preganglionic neuron","Postganglionic neuron","Afferent neuron","Somatic neuron"], "B"],
  ["Afferent signals travel:", ["CNS → Body","Body → CNS","Muscle → Muscle","CNS → Ganglion"], "B"],
  ["Efferent signals travel:", ["Body → CNS","CNS → Body","Receptor → CNS","Skin → Brain only"], "B"],
  ["Which word can help you remember Afferent?", ["Exits","Arrives","External","Efferent"], "B"],
  ["An Action Potential is:", ["A chemical hormone","An electrical signal traveling along the neuron membrane","A type of muscle","A nerve cell body"], "B"],
  ["A mixed nerve contains:", ["Sensory fibers only","Motor fibers only","Both sensory and motor fibers","Only autonomic fibers"], "C"],
  ["Sensory fibers are mainly:", ["Efferent","Afferent","Motor","Postganglionic"], "B"],
  ["In the spinal cord, Gray Matter is mainly located:", ["Outside","Inside","Only in the posterior side","Only in the anterior side"], "B"],
  ["White Matter in the spinal cord is mainly:", ["Inside the Gray Matter","Around the Gray Matter","Only in the brain","Only in the ganglia"], "B"],
  ["The Anterior Horn of the spinal cord is mainly:", ["Sensory","Motor","Autonomic only","Afferent only"], "B"],
  ["The Posterior Horn is mainly associated with:", ["Motor function","Sensory function","Cardiac function","Gland secretion"], "B"],
  ["The Lateral Horn is associated mainly with:", ["Somatic motor function","Sensory function","Autonomic function","Skeletal muscle contraction only"], "C"],
  ["Which statement is CORRECT?", ["Somatic = Involuntary","Autonomic = Voluntary","Somatic uses one motor neuron","Autonomic uses no ganglion"], "C"]
];

// Rich Arabic Explanations & Medical Terms (Zero Emojis)
const explanations = {
  0: {
    rule: "وظيفة الجهاز العصبي الجسدي (Somatic Nervous System)",
    ar: "الجهاز العصبي الجسدي (Somatic Nervous System - SNS) مسؤول حصرياً عن الحركات الإرادية والواعية (Voluntary movements) للعضلات الهيكلية. أما الوظائف اللاإرادية (Involuntary) وإفراز الغدد ونبضات القلب فتخضع للجهاز العصبي الذاتي (Autonomic Nervous System).",
    terms: "Somatic (جسدي/إرادي) • Voluntary movements (حركات إرادية) • Involuntary (لاإرادي) • Autonomic (ذاتي)"
  },
  1: {
    rule: "الأعضاء المستجيبة للجهاز الجسدي (Effector Organs)",
    ar: "المستجيب الحركي للجهاز الجسدي هو العضلات الهيكلية فقط (Skeletal muscle). أما عضلات القلب (Cardiac muscle) والعضلات الملساء في الأحشاء (Smooth muscle) والغدد فتخضع للجهاز الذاتي.",
    terms: "Skeletal muscle (عضلات هيكلية) • Smooth muscle (عضلات ملساء) • Cardiac muscle (عضلة القلب)"
  },
  2: {
    rule: "أمثلة الأفعال الإرادية (Voluntary Action)",
    ar: "تحريك اليد بوعي واختيار هو حركة إرادية (Voluntary action) تصدر بأمر مباشر من القشرة الحركية بالمخ (Motor cortex) وتنتقل عبر ألياف الجهاز الجسدي.",
    terms: "Voluntary action (فعل إرادي) • Motor cortex (القشرة الحركية)"
  },
  3: {
    rule: "عدد الخلايا في المسار الحركي الجسدي (Somatic Motor Pathway)",
    ar: "المسار الحركي الجسدي يتكون من خلية عصبية حركية واحدة فقط (One motor neuron) تمتد من القرن الأمامي للنخاع الشوكي مباشرة إلى العضلة دون أي انقطاع أو عقد عصبية طرفية.",
    terms: "One motor neuron (خلية حركية واحدة) • No ganglia (بدون عقد طرفية)"
  },
  4: {
    rule: "مسار النبضة في الجهاز الجسدي",
    ar: "ينطلق المسار مباشرة من الجهاز العصبي المركزي (CNS) عبر خلية حركية واحدة سفلية (Lower Motor Neuron) لتلتقي بالعضلة الهيكلية (Skeletal Muscle) عند المشبك العصبي العضلي.",
    terms: "CNS (الجهاز العصبي المركزي) • Lower Motor Neuron (خلية حركية سفلية)"
  },
  5: {
    rule: "تركيب المسار الحركي الذاتي (Autonomic Motor Pathway)",
    ar: "المسار الحركي الذاتي (Autonomic) يتكون دائماً من خليتين عصبيتين متتاليتين (Two neurons): خلية قبل العقدة وخلية بعد العقدة وتلتقيان داخل عقدة عصبية ذاتية.",
    terms: "Two neurons (خليتان عصبيتان) • Autonomic Ganglion (عقدة ذاتية)"
  },
  6: {
    rule: "الخلية الأولى في المسار الذاتي (Preganglionic Neuron)",
    ar: "تسمى الخلية الأولى بالخلية قبل العقدية (Preganglionic neuron) لأن جسمها يقع داخل الجهاز العصبي المركزي (CNS) ومحورها يمتد حتى يصل إلى العقدة العصبية الطرفية.",
    terms: "Preganglionic neuron (خلية قبل عقدية) • CNS origin (منشأ مركزي)"
  },
  7: {
    rule: "الخلية الثانية في المسار الذاتي (Postganglionic Neuron)",
    ar: "تسمى الخلية الثانية بالخلية بعد العقدية (Postganglionic neuron)؛ ينطلق محورها من داخل العقدة العصبية ليصل إلى العضو المستهدف (عضلات ملساء، قلب، أو غدد).",
    terms: "Postganglionic neuron (خلية بعد عقدية) • Effector target (العضو المستهدف)"
  },
  8: {
    rule: "اتجاه الإشارات الواردة (Afferent Signals)",
    ar: "الإشارات الواردة أو الحسية (Afferent signals) تسير من محيط وأعضاء الجسم (Body / Receptors) باتجاه الجهاز العصبي المركزي (CNS) لتبليغ المخ بالإحساس.",
    terms: "Afferent (وارد / حسي) • Direction: Body → CNS"
  },
  9: {
    rule: "اتجاه الإشارات الصادرة (Efferent Signals)",
    ar: "الإشارات الصادرة أو الحركية (Efferent signals) تنقل الأوامر والتعليمات من الجهاز العصبي المركزي (CNS) باتجاه أعضاء الاستجابة في الجسم (Body / Muscles & Glands).",
    terms: "Efferent (صادر / حركي) • Direction: CNS → Body"
  },
  10: {
    rule: "القاعدة التذكرية لـ Afferent و Efferent",
    ar: "حرف A في (Afferent) يرمز لـ (Arrives = تصل للمخ)، بينما حرف E في (Efferent) يرمز لـ (Exits = تخرج من المخ إلى العضلات والأعضاء).",
    terms: "Afferent = Arrives (تصل) • Efferent = Exits (تخرج)"
  },
  11: {
    rule: "تعريف جهد الفعل (Action Potential)",
    ar: "جهد الفعل (Action Potential) هو إشارة ونبضة كهربية سريعة تنتقل على طول غشاء الخلية العصبية نتيجة تدفق أيونات الصوديوم والبوتاسيوم عبر الغشاء.",
    terms: "Action Potential (جهد الفعل) • Electrical impulse (نبضة كهربية)"
  },
  12: {
    rule: "العصب المختلط (Mixed Nerve)",
    ar: "العصب المختلط (Mixed nerve) - مثل الأعصاب الشوكية - يحتوي على حزم من الألياف الحسية الواردة (Sensory afferent) والألياف الحركية الصادرة (Motor efferent) معاً.",
    terms: "Mixed nerve (عصب مختلط) • Both sensory & motor (حسي وحركي معاً)"
  },
  13: {
    rule: "طبيعة الألياف الحسية (Sensory Fibers)",
    ar: "الألياف الحسية (Sensory fibers) هي ألياف واردة (Afferent) وظيفتها نقل الإحساس كالألم والحرارة واللمس من المستقبلات المحيطية إلى الجهاز العصبي المركزي.",
    terms: "Sensory fibers = Afferent (ألياف حسية = واردة)"
  },
  14: {
    rule: "موقع المادة الرمادية في الحبل الشوكي (Gray Matter in Spinal Cord)",
    ar: "في النخاع الشوكي، تكون المادة الرمادية (Gray Matter) في الداخل (Inside) على شكل فراشة وتحتوي على أجسام الخلايا العصبية والتشابكات، بينما المادة البيضاء تحيط بها من الخارج.",
    terms: "Gray Matter (مادة رمادية) • Position: Inside (بالداخل في النخاع الشوكي)"
  },
  15: {
    rule: "موقع المادة البيضاء في الحبل الشوكي (White Matter in Spinal Cord)",
    ar: "المادة البيضاء (White Matter) في النخاع الشوكي تقع في المحيط الخارجي حول المادة الرمادية (Around the Gray Matter)، وتتكون من مسارات عصبية مغطاة بالميالين.",
    terms: "White Matter (مادة بيضاء) • Position: Around the Gray Matter (في المحيط الخارجي)"
  },
  16: {
    rule: "وظيفة القرن الأمامي للنخاع الشوكي (Anterior / Ventral Horn)",
    ar: "القرن الأمامي (Anterior Horn) يحتوي على أجسام الخلايا العصبية الحركية (Motor neurons) المسؤولة عن تحريك العضلات الإرادية. القاعدة الطبية: الأمامي = حركي (Ventral = Motor).",
    terms: "Anterior Horn (القرن الأمامي) • Motor Function (وظيفة حركية)"
  },
  17: {
    rule: "وظيفة القرن الخلفي للنخاع الشوكي (Posterior / Dorsal Horn)",
    ar: "القرن الخلفي (Posterior Horn) يحتوي على خلايا حسية وتفرعات لاستقبال الإشارات الحسية (Sensory) القادمة من الجسم. القاعدة الطبية: الخلفي = حسي (Dorsal = Sensory).",
    terms: "Posterior Horn (القرن الخلفي) • Sensory Function (وظيفة حسية)"
  },
  18: {
    rule: "وظيفة القرن الجانبي للنخاع الشوكي (Lateral Horn)",
    ar: "القرن الجانبي (Lateral Horn) يحتوي على أجسام الخلايا العصبية للجهاز العصبي الذاتي (Autonomic Nervous System: Sympathetic) ويتواجد في الفقرات الصدرية والقطنية العليا.",
    terms: "Lateral Horn (القرن الجانبي) • Autonomic function (وظيفة ذاتية)"
  },
  19: {
    rule: "المقارنة الصحيحة بين الجسدي والذاتي",
    ar: "العبارة الصحيحة علمياً هي أن الجهاز الجسدي يستخدم خلية حركية واحدة فقط تمتد مباشرة للعضلة (Somatic uses one motor neuron). بينما الجهاز الذاتي إرادي خطأ (هو لاإرادي)، والجسدي إرادي، والذاتي له عقد.",
    terms: "Somatic = One motor neuron • Autonomic = Two neurons + Ganglion"
  }
};

const SESSION_STORAGE_KEY = "tashheel_physio_quiz_session_v1";

function persistSession(updates) {
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    const curr = raw ? JSON.parse(raw) : {};
    const merged = { ...curr, ...updates };
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(merged));
  } catch (e) {}
}

function getSession() {
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function clearSession() {
  try {
    localStorage.removeItem(SESSION_STORAGE_KEY);
  } catch (e) {}
}

let currentStudentName = "";
let examStartTime = 0;
let timerInterval = null;
let onlyShowWrong = false;
let lastExamResult = null;

// Start Exam
function startExam(e) {
  if (e) e.preventDefault();
  const nameInput = document.getElementById("studentName");
  currentStudentName = nameInput.value.trim();

  if (currentStudentName.length < 2) {
    nameInput.focus();
    nameInput.setCustomValidity("يرجى إدخال الاسم للبدء");
    nameInput.reportValidity();
    return;
  }
  nameInput.setCustomValidity("");

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("examScreen").style.display = "block";
  document.getElementById("activeStudentName").textContent = currentStudentName;

  renderQuestions();

  examStartTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);

  persistSession({
    screen: "exam",
    studentName: currentStudentName,
    startTime: examStartTime,
    answers: {}
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Timer
function updateTimer() {
  const elapsedSeconds = Math.floor((Date.now() - examStartTime) / 1000);
  const m = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
  const s = String(elapsedSeconds % 60).padStart(2, '0');
  document.getElementById("examTimer").textContent = `${m}:${s}`;
}

// Render Questions
function renderQuestions() {
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";

  questions.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = `qCard_${i}`;

    let optionsHtml = "";
    q[1].forEach((opt, j) => {
      const letter = String.fromCharCode(65 + j);
      optionsHtml += `
        <label class="option-label" id="optLabel_${i}_${letter}" onclick="selectOption(${i}, '${letter}')">
          <input type="radio" name="q_${i}" value="${letter}" />
          <span><strong>${letter})</strong> ${opt}</span>
        </label>
      `;
    });

    card.innerHTML = `
      <div class="question-top">
        <span class="q-number">Question ${i + 1} of 20</span>
      </div>
      <div class="q-title">${q[0]}</div>
      <div class="options-list">${optionsHtml}</div>
    `;

    container.appendChild(card);
  });
}

// Select Option Interaction
function selectOption(qIndex, letter) {
  const card = document.getElementById(`qCard_${qIndex}`);
  if (card) {
    const labels = card.querySelectorAll(".option-label");
    labels.forEach(l => l.classList.remove("selected"));
  }

  const targetLabel = document.getElementById(`optLabel_${qIndex}_${letter}`);
  if (targetLabel) {
    targetLabel.classList.add("selected");
    const radio = targetLabel.querySelector('input[type="radio"]');
    if (radio) radio.checked = true;
  }

  updateProgress();

  // Persist selected answer to session
  const session = getSession() || {};
  const currentAnswers = session.answers || {};
  currentAnswers[qIndex] = letter;
  persistSession({ answers: currentAnswers });
}

// Update Progress Bar
function updateProgress() {
  let answered = 0;
  for (let i = 0; i < questions.length; i++) {
    if (document.querySelector(`input[name="q_${i}"]:checked`)) {
      answered++;
    }
  }
  document.getElementById("answeredCount").textContent = answered;
  const percent = Math.round((answered / questions.length) * 100);
  document.getElementById("progressFill").style.width = percent + "%";
}

// Submit Exam
function submitExam() {
  let answeredCount = 0;
  for (let i = 0; i < questions.length; i++) {
    if (document.querySelector(`input[name="q_${i}"]:checked`)) {
      answeredCount++;
    }
  }

  if (answeredCount < questions.length) {
    const remaining = questions.length - answeredCount;
    const confirmSubmit = confirm(`تنبيه: يوجد ${remaining} سؤال لم تقم بالإجابة عليها بعد.\n\nهل تريد تسليم الامتحان بالتأكيد؟`);
    if (!confirmSubmit) return;
  }

  clearInterval(timerInterval);

  let score = 0;
  const wrongQuestions = [];
  const wrongDetails = [];
  const allResults = [];

  questions.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q_${i}"]:checked`);
    const studentAns = selected ? selected.value : null;
    const correctAns = q[2];
    const isCorrect = studentAns === correctAns;

    if (isCorrect) {
      score++;
    } else {
      wrongQuestions.push(i + 1); // 1-indexed question number
      wrongDetails.push({
        questionNumber: i + 1,
        question: q[0],
        studentAnswer: studentAns || "لم تتم الإجابة",
        correctAnswer: correctAns,
        options: q[1]
      });
    }

    allResults.push({
      questionNumber: i + 1,
      question: q[0],
      studentAnswer: studentAns || "لم تتم الإجابة",
      correctAnswer: correctAns,
      isCorrect: isCorrect,
      options: q[1]
    });
  });

  const percentage = Math.round((score / questions.length) * 100);
  const now = new Date();
  const dateStr = now.toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });

  const examResultData = {
    id: "res_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
    name: currentStudentName,
    score: score,
    total: questions.length,
    percentage: percentage,
    wrongQuestions: wrongQuestions,
    wrongDetails: wrongDetails,
    date: dateStr,
    timestamp: Date.now()
  };

  lastExamResult = {
    data: examResultData,
    allResults: allResults
  };

  // Save to LocalStorage
  saveResultToLocalStorage(examResultData);

  // Send to Server quietly in background (without displaying any message)
  saveResultToServer(examResultData);

  // Persist session state as 'result'
  persistSession({
    screen: "result",
    studentName: currentStudentName,
    score: score,
    percentage: percentage,
    allResults: allResults,
    wrongQuestions: wrongQuestions,
    onlyShowWrong: false
  });

  // Render Result Screen
  showResultScreen(score, percentage, allResults, wrongQuestions);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Save to LocalStorage
function saveResultToLocalStorage(resultData) {
  try {
    const key = "tashheel_physiology_quiz_results";
    const existing = JSON.parse(localStorage.getItem(key) || "[]");
    existing.push(resultData);
    localStorage.setItem(key, JSON.stringify(existing));
  } catch (e) {
    console.error("LocalStorage save error", e);
  }
}

// Save to Server API (writes to results.json quietly in background)
async function saveResultToServer(resultData) {
  try {
    await fetch('/api/save-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(resultData)
    });
  } catch (err) {
    // Fail silently in background
  }
}

// Show Result Screen
function showResultScreen(score, percentage, allResults, wrongQuestions) {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("examScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "block";

  const scoreDisplay = document.getElementById("scoreDisplay");
  scoreDisplay.textContent = score;

  const scoreCircle = document.getElementById("scoreCircle");
  if (score === 20) {
    scoreCircle.classList.add("perfect");
  } else {
    scoreCircle.classList.remove("perfect");
  }

  const greeting = document.getElementById("resultGreeting");
  const subtext = document.getElementById("resultSubtext");

  if (percentage === 100) {
    greeting.textContent = `الدرجة كاملة، أحسنت يا ${currentStudentName}!`;
    subtext.textContent = "إجاباتك صحيحة بالكامل بنسبة 100%.";
  } else if (percentage >= 85) {
    greeting.textContent = `أداء ممتاز يا ${currentStudentName}!`;
    subtext.textContent = `حصلت على ${score} من 20 (${percentage}%)`;
  } else if (percentage >= 60) {
    greeting.textContent = `نتيجة جيدة يا ${currentStudentName}`;
    subtext.textContent = `حصلت على ${score} من 20 (${percentage}%) - راجع تصحيح الأسئلة أدناه.`;
  } else {
    greeting.textContent = `فرصة للمراجعة والتحسين يا ${currentStudentName}`;
    subtext.textContent = `حصلت على ${score} من 20 (${percentage}%) - راجع الشروحات الطبية وأعد المحاولة.`;
  }

  renderCorrections(allResults, onlyShowWrong);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Render Corrections List
function renderCorrections(allResults, onlyWrong) {
  const container = document.getElementById("correctionsList");
  container.innerHTML = "";

  const itemsToShow = onlyWrong ? allResults.filter(r => !r.isCorrect) : allResults;

  if (itemsToShow.length === 0) {
    container.innerHTML = `
      <div style="background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:20px;border-radius:12px;text-align:center;font-weight:700">
        جميع إجاباتك صحيحة تماماً في هذا الاختبار.
      </div>
    `;
    return;
  }

  itemsToShow.forEach(item => {
    const qIdx = item.questionNumber - 1;
    const exp = explanations[qIdx] || { rule: "شرح فسيولوجي", ar: "راجع محتوى المحاضرة", terms: "" };

    const card = document.createElement("div");
    card.className = `correction-card ${item.isCorrect ? 'is-correct' : 'is-wrong'}`;

    card.innerHTML = `
      <div class="correction-header">
        <span style="font-weight:800;font-size:13.5px">السؤال ${item.questionNumber} من 20</span>
        <span class="q-badge-status ${item.isCorrect ? 'status-correct' : 'status-wrong'}">
          ${item.isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}
        </span>
      </div>

      <div class="q-text-en">${item.question}</div>

      <div class="answers-grid">
        ${!item.isCorrect ? `
          <div class="ans-box ans-user-wrong">
            إجابتك: <strong>${item.studentAnswer}</strong>
          </div>
        ` : ''}
        <div class="ans-box ans-correct-key">
          الإجابة الصحيحة: <strong>${item.correctAnswer}) ${item.options[item.correctAnswer.charCodeAt(0) - 65]}</strong>
        </div>
      </div>

      <div class="medical-explanation">
        <div class="explanation-title">${exp.rule}:</div>
        <p>${exp.ar}</p>
        ${exp.terms ? `<div class="medical-terms">مصطلحات طبية: ${exp.terms}</div>` : ''}
      </div>
    `;

    container.appendChild(card);
  });
}

// Toggle Correction Filter (All vs Wrong only)
function toggleCorrectionFilter() {
  if (!lastExamResult) return;
  onlyShowWrong = !onlyShowWrong;
  const btn = document.getElementById("filterToggleBtn");
  btn.textContent = onlyShowWrong ? "عرض جميع الأسئلة العشرين" : "عرض الأسئلة الخاطئة فقط";
  renderCorrections(lastExamResult.allResults, onlyShowWrong);
  persistSession({ onlyShowWrong: onlyShowWrong });
}

// Reset Exam
function resetExam() {
  if (confirm("هل تريد إعادة أداء الامتحان من جديد؟")) {
    clearSession();
    clearInterval(timerInterval);
    lastExamResult = null;
    currentStudentName = "";

    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("examScreen").style.display = "none";
    document.getElementById("startScreen").style.display = "flex";

    const nameInput = document.getElementById("studentName");
    if (nameInput) {
      nameInput.value = "";
      nameInput.focus();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// Restore active session on page reload (stay on the same screen)
function initFromSession() {
  const session = getSession();
  if (!session || !session.screen) return;

  if (session.screen === "exam" && session.studentName) {
    currentStudentName = session.studentName;
    examStartTime = session.startTime || Date.now();

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("examScreen").style.display = "block";
    document.getElementById("activeStudentName").textContent = currentStudentName;

    renderQuestions();

    // Re-check previously chosen answers
    if (session.answers) {
      Object.entries(session.answers).forEach(([qIdx, letter]) => {
        const targetLabel = document.getElementById(`optLabel_${qIdx}_${letter}`);
        if (targetLabel) {
          targetLabel.classList.add("selected");
          const radio = targetLabel.querySelector('input[type="radio"]');
          if (radio) radio.checked = true;
        }
      });
    }

    updateProgress();
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  } else if (session.screen === "result" && session.allResults) {
    currentStudentName = session.studentName || "";
    onlyShowWrong = !!session.onlyShowWrong;

    lastExamResult = {
      data: {
        name: currentStudentName,
        score: session.score,
        total: questions.length,
        percentage: session.percentage,
        wrongQuestions: session.wrongQuestions
      },
      allResults: session.allResults
    };

    const btn = document.getElementById("filterToggleBtn");
    if (btn) {
      btn.textContent = onlyShowWrong ? "عرض جميع الأسئلة العشرين" : "عرض الأسئلة الخاطئة فقط";
    }

    showResultScreen(session.score, session.percentage, session.allResults, session.wrongQuestions);
  }
}

// Restore state when page loads
initFromSession();
</script>
